<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Photo Gallery{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81'},
                        accent: {50:'#fdf4ff',100:'#fae8ff',200:'#f5d0fe',300:'#f0abfc',400:'#e879f9',500:'#d946ef',600:'#c026d3',700:'#a21caf',800:'#86198f',900:'#701a75'},
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glass-card { background: rgba(255,255,255,0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.3); }
        .gradient-text { background: linear-gradient(135deg, #6366f1, #d946ef); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99,102,241,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.9); border: 1px solid rgba(99,102,241,0.2); color: #4f46e5; transition: all 0.3s ease; }
        .btn-secondary:hover { background: #4f46e5; color: white; border-color: #4f46e5; transform: translateY(-2px); }
        .card-hover { transition: all 0.4s cubic-bezier(0.4,0,0.2,1); }
        .card-hover:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .slide-down { animation: slideDown 0.4s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .tag-chip { transition: all 0.3s ease; }
        .tag-chip:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        .input-field { transition: all 0.3s ease; border: 2px solid #e5e7eb; }
        .input-field:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); outline: none; }
        body { background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #f0f4ff 100%); background-attachment: fixed; }
        .nav-blur { background: rgba(255,255,255,0.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        .like-btn { transition: all 0.3s ease; }
        .like-btn:hover { transform: scale(1.1); }
        .like-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen">
    <nav class="nav-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="{% url 'home' %}" class="flex items-center space-x-2 group">
                    <span class="text-3xl">📸</span>
                    <span class="text-xl font-bold gradient-text group-hover:opacity-80 transition-opacity">PhotoGallery</span>
                </a>
                <div class="flex items-center space-x-3">
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="btn-secondary px-4 py-2 rounded-xl text-sm font-medium">
                            👤 Profile
                        </a>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium text-white transition-all duration-300 hover:shadow-lg" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                                Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn-secondary px-4 py-2 rounded-xl text-sm font-medium">
                            Login
                        </a>
                        <a href="{% url 'register' %}" class="btn-primary px-4 py-2 rounded-xl text-sm font-medium text-white">
                            Get Started
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    {% if messages %}
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
            {% for message in messages %}
                <div class="slide-down glass-card rounded-xl px-5 py-4 flex items-center space-x-3 text-green-800 border-l-4 border-green-500">
                    <span class="text-xl">✅</span>
                    <p class="text-sm font-medium">{{ message }}</p>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-200/50 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
            <p class="text-gray-400 text-sm">Photo Gallery — built with Django & Tailwind CSS</p>
        </div>
    </footer>
</body>
</html>
