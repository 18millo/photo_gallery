{% extends 'base.html' %}
{% load gallery_tags %}

{% block title %}Password Changed - Photo Gallery{% endblock %}

{% block content %}
    <div class="min-h-[80vh] flex items-center justify-center px-4">
        <div class="w-full max-w-md text-center reveal">
            <div class="glass-strong rounded-3xl p-10 sm:p-12">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center mx-auto mb-6 shadow-xl shadow-green-500/20">
                    <span class="text-4xl">✅</span>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-3 font-[family-name:var(--font-display)]">All Set!</h1>
                <p class="text-gray-400 mb-8 text-sm">Your password has been updated successfully.</p>
                <a href="{% url 'profile' %}" class="btn-primary inline-flex items-center space-x-2 px-8 py-3.5 rounded-2xl text-white font-semibold text-sm">
                    <span>←</span><span>Back to Profile</span>
                </a>
            </div>
        </div>
    </div>
{% endblock %}
