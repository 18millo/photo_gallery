{% extends 'base.html' %}

{% block title %}Password Changed - Photo Gallery{% endblock %}

{% block content %}
    <div class="min-h-[80vh] flex items-center justify-center fade-in">
        <div class="w-full max-w-md text-center">
            <div class="glass-card rounded-3xl p-10">
                <span class="text-6xl block mb-6">✅</span>
                <h1 class="text-3xl font-extrabold text-gray-900 mb-3">Password Changed!</h1>
                <p class="text-gray-500 mb-8">Your password has been updated successfully.</p>
                <a href="{% url 'profile' %}" class="btn-primary inline-flex items-center space-x-2 px-8 py-3 rounded-xl text-white font-semibold text-sm">
                    <span>←</span><span>Back to Profile</span>
                </a>
            </div>
        </div>
    </div>
{% endblock %}
